<svg xmlns="http://www.w3.org/2000/svg" width="168" height="90" viewBox="-1 -1 28 15" shape-rendering="crispEdges"><style>.sign{transform-origin:4px 13px;animation:wave .5s ease-in-out infinite}.body{animation:shake .16s steps(1) infinite}.la{animation:stomp .32s steps(1) infinite}.lb{animation:stomp .32s steps(1) infinite -.16s}.arm{transform-origin:22px 5px;animation:flail .32s steps(1) infinite}.eyes{animation:dart .64s steps(1) infinite}.s1{animation:drip .8s linear infinite}.s2{animation:drip .8s linear infinite -.4s}@keyframes wave{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}@keyframes shake{50%{transform:translateX(.5px)}}@keyframes stomp{50%{transform:translateY(-1px)}}@keyframes flail{50%{transform:rotate(35deg)}}@keyframes dart{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}@keyframes drip{0%{transform:translateY(-1px);opacity:1}100%{transform:translateY(4px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="5" y="8" width="5" height="1" fill="#D97757"/><g class="sign"><rect x="3.5" y="7" width="1" height="6" fill="#8A8A8A"/><polygon points="2,0 6,0 8,2 8,5 6,7 2,7 0,5 0,2" fill="#D92D20"/><polygon points="2.4,1 5.6,1 7,2.4 7,4.6 5.6,6 2.4,6 1,4.6 1,2.4" fill="none" stroke="#FFFFFF" stroke-width="0.5"/><rect x="3" y="7.5" width="2" height="2" fill="#D97757"/></g><g class="arm"><rect x="22" y="1" width="1" height="4" fill="#D97757"/><rect x="22" y="1" width="2" height="1" fill="#D97757"/></g><g class="body"><g class="la"><rect x="11" y="10" width="1" height="2" fill="#D97757"/><rect x="18" y="10" width="1" height="2" fill="#D97757"/></g><g class="lb"><rect x="13" y="10" width="1" height="2" fill="#D97757"/><rect x="20" y="10" width="1" height="2" fill="#D97757"/></g><rect x="10" y="3" width="12" height="7" fill="#D97757"/><rect x="12" y="4" width="3" height="3" fill="#FFFFFF"/><rect x="17" y="4" width="3" height="3" fill="#FFFFFF"/><g class="eyes"><rect x="13" y="5" width="1" height="1" fill="#1F1E1D"/><rect x="18" y="5" width="1" height="1" fill="#1F1E1D"/></g><rect x="15" y="8" width="2" height="2" fill="#1F1E1D"/></g><g class="s1"><rect x="24" y="5" width="1" height="2" fill="#4AA8E8"/></g><g class="s2"><rect x="8" y="1" width="1" height="2" fill="#4AA8E8"/></g></svg>
